server {
    listen 80;
    server_name kazan-round13.online www.kazan-round13.online 159.194.207.82;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name kazan-round13.online www.kazan-round13.online 159.194.207.82;

    root /var/www/round13;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/kazan-round13.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kazan-round13.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/health {
        proxy_pass http://127.0.0.1:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
